<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>MotorCare Online V5</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"></head>
<body><main class="app"><header><div><div class="brand">MotorCare</div><div class="sub">Online V5 • Bantuan motor di jalan</div></div><span id="net" class="pill">OFFLINE</span></header>
<section id="auth" class="card"><h2>Masuk</h2><p class="muted">Gunakan akun Customer atau Mechanic.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="row"><button id="login">Masuk</button><button id="signup" class="secondary">Daftar</button></div><div id="authMsg" class="msg"></div></section>
<section id="dashboard" hidden><div class="card welcome"><div><div class="muted">Akun</div><strong id="who"></strong><span id="role" class="pill"></span></div><button id="logout" class="secondary small">Keluar</button></div>
<div id="customer" hidden><div class="card"><h2>Pesan bantuan</h2><select id="service"><option value="">Memuat layanan…</option></select><input id="problem" placeholder="Keluhan motor (contoh: ban bocor)"><button id="gpsCustomer">Ambil lokasi saya</button><div id="gpsC" class="muted"></div><button id="order">Cari mekanik sekarang</button><div id="orderMsg" class="msg"></div></div><div class="card"><h3>Order saya</h3><div id="orders"></div></div></div>
<div id="admin" hidden><div class="card"><h2>Admin • Reset Mechanic Test</h2><p class="muted">Reset khusus akun mechanic.test@motorcare.local. Hanya admin aktif yang dapat menjalankan.</p><input id="resetMechanicPassword" type="password" minlength="8" placeholder="Password baru (min. 8 karakter)"><button id="resetMechanic">Reset password mechanic test</button><div id="resetMechanicMsg" class="msg"></div></div></div><div id="mechanic" hidden><div class="card"><h2>Status mekanik</h2><div class="row"><button id="online">ONLINE</button><button id="offline" class="secondary">OFFLINE</button></div><button id="gpsMechanic">Kirim lokasi GPS</button><div id="gpsM" class="muted"></div></div><div class="card"><h3>Tawaran masuk</h3><div id="offers"></div></div><div class="card"><h3>Order aktif</h3><div id="mechanicOrders"></div></div></div></section>
</main><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script><script src="app.js"></script></body></html>
